<!doctype html>
<!-- phone-qa test page. The server replaces @TOKEN@ per request; every run and
     every consumer (WebView, Brave) gets its own token. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>loading</title>
<style>body { font: 32px sans-serif; margin: 40px; } #t { font-weight: bold; }</style>
</head>
<body>
<p>river-qa</p>
<p id="t">@TOKEN@</p>
<script>
  var token = document.getElementById("t").textContent;
  document.title = token;
  var url = "/beacon/" + token;
  if (!(navigator.sendBeacon && navigator.sendBeacon(url, "ok"))) {
    fetch(url, {method: "POST", body: "ok", keepalive: true});
  }
</script>
</body>
</html>
